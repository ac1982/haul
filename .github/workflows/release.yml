name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Toolchain
        run: swift --version
      - name: Test
        run: swift test
      - name: Build (release, arm64)
        run: |
          swift build -c release --product haul
          file .build/release/haul | grep -q arm64
      - name: Package
        run: |
          mkdir -p dist
          cp .build/release/haul dist/
          cd dist
          zip "../haul-${GITHUB_REF_NAME}-macos-arm64.zip" haul
          cd ..
          shasum -a 256 "haul-${GITHUB_REF_NAME}-macos-arm64.zip" > "haul-${GITHUB_REF_NAME}-macos-arm64.zip.sha256"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "haul-${GITHUB_REF_NAME}-macos-arm64.zip" \
            "haul-${GITHUB_REF_NAME}-macos-arm64.zip.sha256" \
            --title "$GITHUB_REF_NAME" --generate-notes
